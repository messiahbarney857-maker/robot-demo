<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Demo — Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background:#f5f5f5 }
    .container { max-width:800px; margin: 40px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    .header { display:flex; justify-content:space-between; align-items:center }
    #messages { height:400px; overflow:auto; border:1px solid #ddd; padding:10px; margin-top:12px; }
    .msg { margin:8px 0 }
    .user { color:#0b6ef6 }
    .bot { color:#111 }
    .input-row { display:flex; gap:8px; margin-top:12px }
    textarea { flex:1; height:60px; padding:8px }
    button { padding:8px 12px }
    .badge { background:#0b6ef6; color:white; padding:6px 10px; border-radius:6px; text-decoration:none }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Robot Demo — Chat</h2>
      <a class="badge" href="https://github.com/messiahbarney857-maker/robot-demo">Project</a>
    </div>
    <p>Talk to the robot. This chat uses the OpenAI Chat API when an API key is configured in the server (.env).</p>

    <div id="messages"></div>

    <div class="input-row">
      <textarea id="msg" placeholder="Type your message here..."></textarea>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button id="send">Send</button>
        <button id="clear">Clear</button>
      </div>
    </div>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
